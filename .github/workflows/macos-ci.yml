# Pull requests that touch the macOS app: the OrielKit tests and a build (no keys needed: it builds without them).
name: macOS CI

on:
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-*.yml"]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Tests
        run: scripts/test.sh
      - name: Build
        run: scripts/build.sh
