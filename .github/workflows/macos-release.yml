# The macOS app (macos/): builds and publishes a release when a macOS version tag is pushed
# (git tag macos-v1.0.1 && git push origin macos-v1.0.1). Oriel.dmg, Oriel.zip and appcast.xml go to
# github.com/oriel-releases/macos as v1.0.1.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   UNSPLASH_ACCESS_KEY   the macOS Unsplash app's access key
#   POLLINATIONS_KEY      the Pollinations key for AI wallpapers (the same one as windows/.env)
#   SPARKLE_PUBLIC_KEY    Sparkle's public EdDSA key (also in .env)
#   SPARKLE_PRIVATE_KEY   the private key, exported once with generate_keys -x (never in the repo)
#   RELEASES_TOKEN        a fine-grained token with Contents: read and write on oriel-releases/macos
name: macOS release

on:
  push:
    tags: ["macos-v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: Publish to oriel-releases/macos (off = build only, download the files from the run)
        type: boolean
        default: false

jobs:
  release:
    # Needs Xcode with the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: brew install xcodegen

      - name: The tag matches the version in project.yml
        if: startsWith(github.ref, 'refs/tags/macos-v')
        run: |
          version="$(grep -E '^\s*MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [[ "macos-v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $version in project.yml"
            exit 1
          fi

      - name: Tests
        run: scripts/test.sh

      - name: Build, sign and publish
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.upload }}" == "true" ]]; then
            scripts/release.sh
          else
            scripts/release.sh --no-upload
          fi

      - name: Keep the files with the run
        uses: actions/upload-artifact@v4
        with:
          name: Oriel-macOS
          path: macos/releases/
          retention-days: 14
