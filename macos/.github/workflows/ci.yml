# Pull requests: the OrielKit tests and a build of the app (no keys needed: it builds without them).
name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Tests
        run: scripts/test.sh
      - name: Build
        run: scripts/build.sh
